services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rh_reclutamiento
      POSTGRES_USER: rh_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rh_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rh_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rh_user -d rh_reclutamiento"]
      interval: 5s
      retries: 10
volumes:
  rh_postgres:
