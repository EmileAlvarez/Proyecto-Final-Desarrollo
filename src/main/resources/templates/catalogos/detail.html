<!doctype html>
<html
  lang="es"
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{fragments/layout :: shell(~{::section})}"
>
  <body>
    <section>
      <div class="page-heading">
        <div>
          <div class="eyebrow" th:text="${tipo.titulo}"></div>
          <h1 th:text="${item.nombre}"></h1>
          <p class="subtitle" th:text="|Registro #${item.id}|"></p>
        </div>
        <div class="d-flex gap-2">
          <a
            class="btn btn-outline-secondary"
            th:href="@{/{ruta}(ruta=${tipo.ruta})}"
            >Volver</a
          ><a
            class="btn btn-primary"
            th:href="@{/{ruta}/{id}/editar(ruta=${tipo.ruta},id=${item.id})}"
            ><i aria-hidden="true" class="bi bi-pencil"></i> Editar registro</a
          >
        </div>
      </div>
      <div class="panel form-narrow">
        <div class="panel-heading">
          <h2>Información general</h2>
          <span th:replace="~{fragments/ui :: badge(${item.estado})}"></span>
        </div>
        <div class="panel-body">
          <dl class="detail-grid">
            <div>
              <dt>Nombre / Descripción</dt>
              <dd th:text="${item.nombre}"></dd>
            </div>
            <div>
              <dt>Estado</dt>
              <dd th:text="${@fmt.etiqueta(item.estado)}"></dd>
            </div>
            <th:block th:if="${tipo.ruta == 'puestos'}"
              ><div>
                <dt>Nivel de riesgo</dt>
                <dd th:text="${@fmt.etiqueta(item.riesgo)}"></dd>
              </div>
              <div>
                <dt>Rango salarial</dt>
                <dd
                  th:text="|${@fmt.dinero(item.salarioMinimo)} — ${@fmt.dinero(item.salarioMaximo)}|"
                ></dd></div
            ></th:block>
            <th:block th:if="${tipo.ruta == 'capacitaciones'}"
              ><div>
                <dt>Nivel</dt>
                <dd th:text="${@fmt.etiqueta(item.nivel)}"></dd>
              </div>
              <div>
                <dt>Institución</dt>
                <dd th:text="${item.institucion}"></dd>
              </div>
              <div>
                <dt>Fecha desde</dt>
                <dd th:text="${item.fechaDesde}"></dd>
              </div>
              <div>
                <dt>Fecha hasta</dt>
                <dd th:text="${item.fechaHasta ?: 'En curso'}"></dd></div
            ></th:block>
          </dl>
        </div>
      </div>
    </section>
  </body>
</html>
