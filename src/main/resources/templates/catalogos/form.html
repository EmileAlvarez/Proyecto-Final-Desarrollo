<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: shell(~{::section})}"><body><section>
<div class="page-heading"><div><div class="eyebrow" th:text="${tipo.titulo}"></div><h1 th:text="${id == null ? 'Nuevo registro' : 'Editar registro'}"></h1><p class="subtitle">Completa los campos marcados con *.</p></div><a class="btn btn-outline-secondary" th:href="@{/{ruta}(ruta=${tipo.ruta})}"><i aria-hidden="true" class="bi bi-arrow-left"></i> Volver al catálogo</a></div>
<form class="panel form-narrow" method="post" th:action="${id == null ? '/' + tipo.ruta : '/' + tipo.ruta + '/' + id}" th:object="${form}" th:data-confirm="${id != null ? '¿Deseas guardar los cambios de este registro?' : null}"><input type="hidden" th:field="*{version}">
<div class="form-section"><div th:replace="~{fragments/ui :: errors}"></div><h2 class="form-section-title"><i aria-hidden="true" class="bi bi-pencil-square"></i> Información del registro</h2><div class="row g-4">
<div class="col-md-6"><label class="form-label" for="nombre">Nombre / Descripción<span class="required">*</span></label><input class="form-control" id="nombre" type="text" th:field="*{nombre}" required  maxlength="180"><div th:replace="~{fragments/ui :: fieldError('nombre')}"></div></div><div class="col-md-6"><label class="form-label" for="estado">Estado<span class="required">*</span></label><select class="form-select" id="estado" th:field="*{estado}" required><option value="">Seleccionar…</option><option th:each="x : ${estados}" th:value="${x}" th:text="${@fmt.etiqueta(x)}"></option></select><div th:replace="~{fragments/ui :: fieldError('estado')}"></div></div>
<th:block th:if="${tipo.ruta == 'puestos'}"><div class="col-md-6"><label class="form-label" for="riesgo">Nivel de riesgo<span class="required">*</span></label><select class="form-select" id="riesgo" th:field="*{riesgo}" required><option value="">Seleccionar…</option><option th:each="x : ${riesgos}" th:value="${x}" th:text="${@fmt.etiqueta(x)}"></option></select><div th:replace="~{fragments/ui :: fieldError('riesgo')}"></div></div><div class="col-md-6"><label class="form-label" for="salarioMinimo">Salario mínimo (RD$)<span class="required">*</span></label><input class="form-control" id="salarioMinimo" type="number" th:field="*{salarioMinimo}" required step="0.01" min="0" ><div th:replace="~{fragments/ui :: fieldError('salarioMinimo')}"></div></div><div class="col-md-6"><label class="form-label" for="salarioMaximo">Salario máximo (RD$)<span class="required">*</span></label><input class="form-control" id="salarioMaximo" type="number" th:field="*{salarioMaximo}" required step="0.01" min="0.01" ><div th:replace="~{fragments/ui :: fieldError('salarioMaximo')}"></div></div><div class="col-12"><div th:replace="~{fragments/ui :: fieldError('rangoValido')}"></div></div></th:block>
<th:block th:if="${tipo.ruta == 'capacitaciones'}"><div class="col-md-6"><label class="form-label" for="nivel">Nivel académico<span class="required">*</span></label><select class="form-select" id="nivel" th:field="*{nivel}" required><option value="">Seleccionar…</option><option th:each="x : ${niveles}" th:value="${x}" th:text="${@fmt.etiqueta(x)}"></option></select><div th:replace="~{fragments/ui :: fieldError('nivel')}"></div></div><div class="col-md-6"><label class="form-label" for="institucion">Institución<span class="required">*</span></label><input class="form-control" id="institucion" type="text" th:field="*{institucion}" required  maxlength="180"><div th:replace="~{fragments/ui :: fieldError('institucion')}"></div></div><div class="col-md-6"><label class="form-label" for="fechaDesde">Fecha desde<span class="required">*</span></label><input class="form-control" id="fechaDesde" type="date" th:field="*{fechaDesde}" required  ><div th:replace="~{fragments/ui :: fieldError('fechaDesde')}"></div></div><div class="col-md-6"><label class="form-label" for="fechaHasta">Fecha hasta</label><input class="form-control" id="fechaHasta" type="date" th:field="*{fechaHasta}"   data-start-date="fechaDesde"><div th:replace="~{fragments/ui :: fieldError('fechaHasta')}"></div></div><div class="col-12"><div th:replace="~{fragments/ui :: fieldError('periodoValido')}"></div></div></th:block>
</div></div><div class="form-actions"><a class="btn btn-light" th:href="@{/{ruta}(ruta=${tipo.ruta})}">Cancelar</a><button class="btn btn-primary"><i aria-hidden="true" class="bi bi-check-lg"></i> Guardar registro</button></div></form>
</section></body></html>
