spring.application.name=reclutamiento
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rh_reclutamiento}
spring.datasource.username=${DB_USERNAME:rh_user}
spring.datasource.password=${DB_PASSWORD:rh_local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=30
spring.flyway.enabled=true
spring.thymeleaf.cache=false
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.same-site=lax
app.seed.enabled=${DEMO_SEED:true}
spring.mvc.format.date=yyyy-MM-dd

